# Publica el sitio en GitHub Pages con cada push a main.
#
# Las actions están fijadas por SHA, no por etiqueta: una etiqueta como "v7"
# puede moverse a otro commit, y en un repositorio público eso sería una vía
# de entrada. El comentario al lado indica a qué versión corresponde cada SHA.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: solo lo que hace falta para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez. No cancelamos el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # PREVIEW=1 publica en nicolasalvarez.github.io/terra_compostaje/ en vez del
      # dominio propio. Para pasar a produccion: borrar este bloque `env` y el paso
      # "Quitar el dominio propio" de abajo. Nada mas.
      - name: Construir el sitio
        run: npm run build
        env:
          PREVIEW: '1'

      # El archivo public/CNAME es el mecanismo con el que GitHub configura el
      # dominio propio. Si viaja en el artefacto, el sitio puede quedar servido en
      # terracompostaje.com, cuyo DNS todavia apunta al hosting anterior: el
      # resultado seria un sitio inaccesible por las dos URLs. Mientras dure el
      # preview, lo sacamos del resultado. El archivo sigue en el repo, intacto.
      - name: Quitar el dominio propio (solo preview)
        run: rm -f dist/CNAME

      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
